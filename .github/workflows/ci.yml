name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, validate & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate manifest & store rules
        run: npm run validate
      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end (real extension in Chromium)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  package:
    name: Build store package
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build zip
        run: node scripts/package.mjs
      - name: Check package contents
        run: |
          unzip -l dist/keyflip-*.zip
          unzip -l dist/keyflip-*.zip | grep -q 'manifest.json'
          ! unzip -l dist/keyflip-*.zip | grep -E 'node_modules|tests/|store/|third_party/'
      - uses: actions/upload-artifact@v4
        with:
          name: keyflip-extension
          path: dist/*.zip
          retention-days: 30
